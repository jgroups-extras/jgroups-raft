name: Java CI with Maven

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      checks: write
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
        # Keep this list as: all supported LTS JDKs, the latest GA JDK, and optionally the latest EA JDK (if available).
        # https://www.oracle.com/java/technologies/java-se-support-roadmap.html
        java: [ 17, 21, 25 ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build with Maven
        timeout-minutes: 10
        id: test_runner
        shell: bash
        run: |
          if [[ "$RUNNER_OS" != "Linux" ]]; then
            mvn --batch-mode --no-transfer-progress package -Dgroups=functional -DjgroupsTestsParallelThreads=2
            exit $?
          fi

          mvn --batch-mode --no-transfer-progress package -Dgroups=functional -DjgroupsTestsParallelThreads=2 &
          MVN_PID=$!

          # Watchdog: capture thread dumps if tests hang, fires 3 min before step timeout.
          (
            sleep 180
            echo "::warning::Tests appear hung after 3 minutes. Capturing thread dumps"
            mkdir -p target

            for pid in $(jcmd -l 2>/dev/null | grep -v "jcmd" | awk '{print $1}'); do
              name=$(jcmd -l 2>/dev/null | grep "^$pid " | cut -d' ' -f2-)
              echo "::group::Thread dump PID $pid ($name)"
              jcmd "$pid" Thread.dump_to_file -format=json "target/thread-dump-${pid}.json" 2>/dev/null \
                || jcmd "$pid" Thread.print > "target/thread-dump-${pid}.txt" 2>&1 \
                || true
              cat "target/thread-dump-${pid}.json" 2>/dev/null || cat "target/thread-dump-${pid}.txt" 2>/dev/null || true
              echo "::endgroup::"
            done

            kill "$MVN_PID" 2>/dev/null
          ) &
          WATCHDOG_PID=$!

          wait "$MVN_PID"
          MVN_EXIT=$?

          kill "$WATCHDOG_PID" 2>/dev/null
          wait "$WATCHDOG_PID" 2>/dev/null || true

          exit "$MVN_EXIT"

      - name: Generate reports
        if: matrix.os == 'ubuntu-latest' && matrix.java == 17
        run: mvn --batch-mode --no-transfer-progress surefire-report:report-only spotbugs:spotbugs pmd:pmd

      - name: Annotation with static analysis violations
        if: matrix.os == 'ubuntu-latest' && matrix.java == 17
        run: |
          for sarif in target/pmd.sarif.json target/spotbugs.sarif.json; do                                                                                                                                                            
              tool=$(jq -r '.runs[0].tool.driver.name' "$sarif")
              echo "Verifying $sarif file"
              jq -r --arg tool "$tool" '.runs[].results[] | "::warning file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::[\($tool)] \(.ruleId): \(.message.text)"' "$sarif"
          done

      - name: Generate and upload test reports
        # Only upload reports if tests failed.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: "test-report-${{ matrix.os }}-${{ matrix.java }}"
          # Once SUREFIRE-2219 is finished we can upload only the html report.
          path: |
            target/site
            target/surefire-reports
            target/functional

      - name: Display surefire-reports
        if: failure()
        uses: ScalableCapital/action-surefire-report@4004a71652495d6ed111f5b717c2cf9aa0f37627 # v2
        with:
          check_name: "surefire-report-${{ matrix.os }}-${{ matrix.java }}"

      - name: Display SpotBugs report
        if: matrix.os == 'ubuntu-latest' && matrix.java == 17
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: "spotbugs-report-${{ matrix.os }}-${{ matrix.java }}"
          sarif_file: target/spotbugs.sarif.json

      - name: Display PMD report
        if: matrix.os == 'ubuntu-latest' && matrix.java == 17
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: "pmd-report-${{ matrix.os }}-${{ matrix.java }}"
          sarif_file: target/pmd.sarif.json
